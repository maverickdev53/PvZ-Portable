name: Build macOS Intel Monterey

on:
  push:
  workflow_dispatch:

jobs:
  build-macos:
    name: Build for macOS (x86_64 Monterey)
    runs-on: macos-15-intel
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Build Tools
        run: |
          brew install cmake ninja dylibbundler llvm \
            autoconf automake libtool pkg-config

      - name: Build Game Libraries
        run: |
          set -e
          mkdir -p deps_src deps_install
          INSTALL_DIR="$PWD/deps_install"
          GH="https://github.com"
          cd deps_src

          git clone --depth 1 "$GH/libsdl-org/SDL.git"
          cmake -G Ninja -S SDL -B build-sdl3 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_INSTALL_PREFIX="$INSTALL_DIR"
          cmake --build build-sdl3 && cmake --install build-sdl3

          git clone --depth 1 "$GH/libsdl-org/SDL_mixer.git"
          (cd SDL_mixer && ./external/download.sh)
          cmake -G Ninja -S SDL_mixer -B build-mixer \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_PREFIX_PATH="$INSTALL_DIR" \
            -DCMAKE_INSTALL_PREFIX="$INSTALL_DIR" \
            -DSDLMIXER_VENDORED=ON
          cmake --build build-mixer && cmake --install build-mixer

          git clone --depth 1 "$GH/pnggroup/libpng.git"
          cmake -G Ninja -S libpng -B build-png \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_INSTALL_PREFIX="$INSTALL_DIR" \
            -DPNG_TESTS=OFF
          cmake --build build-png && cmake --install build-png

          git clone --depth 1 "$GH/libjpeg-turbo/libjpeg-turbo.git"
          cmake -G Ninja -S libjpeg-turbo -B build-jpeg \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_INSTALL_PREFIX="$INSTALL_DIR"
          cmake --build build-jpeg && cmake --install build-jpeg

          git clone --depth 1 "$GH/OpenMPT/openmpt.git"
          cd openmpt
          ./build/autotools/autoconfiscate.sh
          ./configure --prefix="$INSTALL_DIR" \
            --disable-openmpt123 --disable-examples --disable-tests \
            --without-mpg123 --without-ogg --without-vorbis \
            --without-vorbisfile --without-portaudio \
            --without-portaudiocpp --without-sndfile --without-flac \
            CFLAGS="-mmacosx-version-min=12.0 -arch x86_64" \
            CXXFLAGS="-mmacosx-version-min=12.0 -arch x86_64" \
            LDFLAGS="-mmacosx-version-min=12.0 -arch x86_64"
          make -j$(sysctl -n hw.ncpu) && make install

      - name: Build PvZ-Portable
        run: |
          set -e
          LLVM_PREFIX="$(brew --prefix llvm)"
          cmake -G Ninja -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_PREFIX_PATH="$PWD/deps_install" \
            -DCMAKE_CXX_FLAGS="-D_LIBCPP_DISABLE_AVAILABILITY" \
            -DCMAKE_EXE_LINKER_FLAGS="-L$LLVM_PREFIX/lib/c++ -Wl,-rpath,@executable_path/libs"
          cmake --build build

          mkdir -p dist dist/libs
          cp build/pvz-portable dist/
          strip -x dist/pvz-portable

          dylibbundler -of -b -x dist/pvz-portable \
            -d dist/libs -p @executable_path/libs/ \
            -s "$PWD/deps_install/lib" \
            -s "$LLVM_PREFIX/lib/c++"
          codesign --force --deep -s - dist/pvz-portable
          codesign --force --deep -s - dist/libs/*

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: pvz-portable-macos-intel-monterey
          path: dist/


